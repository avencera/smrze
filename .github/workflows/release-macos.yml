name: Release macOS Apple Silicon

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: smrze
  TARGET: aarch64-apple-darwin

jobs:
  build:
    name: Build macOS Apple Silicon binary
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-bin: false
          prefix-key: v1-rust

      - name: Install Metal Toolchain
        run: |
          if ! xcrun metal -v >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build
        run: cargo build --locked --release --target ${{ env.TARGET }}

      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/${BIN}-${GITHUB_REF_NAME}-${TARGET}.tar.gz" \
            --directory="target/${TARGET}/release" \
            "${BIN}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.BIN }}-${{ github.ref_name }}-${{ env.TARGET }}.tar.gz
